spring:
  application:
    name: auth-service
  profiles:
    active: dev # Profil par défaut

server:
  port: 8081

# 5. ENREGISTREMENT EUREKA
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true # Meilleure pratique en microservices sur Ubuntu

# 6. ACTUATOR (Pour le monitoring de la santé du service)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# 7. CONFIGURATION SWAGGER
springdoc:
  api-docs:
    path: /api/v1/auth/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
