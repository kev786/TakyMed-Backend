spring:
  # CONFIGURATION DE LA BASE DE DONNÉES (Dev utilise Docker)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # GESTION DOCKER COMPOSE (Activé en dev)
  docker:
    compose:
      file: ../docker-compose.yml
      enabled: true
      readiness:
        wait: ALWAYS

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  # CONFIGURATION MAIL (Gmail)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
