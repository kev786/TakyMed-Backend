spring:
  # CONFIGURATION DE LA BASE DE DONNÉES (Prod)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # GESTION DOCKER COMPOSE (Désactivé en prod)
  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate # Sécurité : ne pas modifier le schéma automatiquement en prod
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
